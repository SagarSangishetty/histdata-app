name: application-ci

on:
  
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "pom.xml"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/ci.yml"
  

  push:
    branches:
      - main
    paths:
      - "src/**"
      - "pom.xml"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/ci.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: histdata-app

jobs:
  test:
    name: Test application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run Maven tests
        run: mvn -B -ntp clean test

  image:
    name: Build and push image
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          role-session-name: histdata-app-ci
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: "935776475838"

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  promote-dev:
    name: Create dev image promotion PR
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: image
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App token
        id: release-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: histdata-k8s-deployments

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: SagarSangishetty/histdata-k8s-deployments
          ref: main
          token: ${{ steps.release-token.outputs.token }}
          path: gitops

      - name: Update dev image tag
        uses: mikefarah/yq@v4
        with:
          cmd: >-
            yq -i
            '.image.tag = strenv(IMAGE_TAG)'
            gitops/environments/dev/values.yaml
        env:
          IMAGE_TAG: ${{ github.sha }}

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Validate dev Helm release
        working-directory: gitops
        run: |
          helm lint charts/histdata \
            --values environments/dev/values.yaml

          helm template histdata charts/histdata \
            --namespace histdata \
            --values environments/dev/values.yaml \
            >/dev/null

      - name: Create dev promotion pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.release-token.outputs.token }}
          path: gitops
          base: main
          branch: automation/promote-histdata-dev
          delete-branch: true
          commit-message: "chore(dev): deploy histdata-app ${{ github.sha }}"
          title: "chore(dev): deploy histdata-app ${{ github.sha }}"
          body: |
            Automated development image promotion.

            Source repository: `${{ github.repository }}`
            Source commit: `${{ github.sha }}`
            Image: `${{ vars.AWS_ACCOUNT_ID || '935776475838' }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ github.sha }}`

            After this PR is merged, Argo CD will synchronize the new image to the development EKS cluster.
