<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HistData Login</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="login-body">
<main class="login-card">
    <div class="brand-mark">HD</div>
    <h1>HistData</h1>
    <p class="muted">Historical market data access</p>
    <div class="alert error" th:if="${param.error}">Invalid username or password.</div>
    <div class="alert success" th:if="${param.logout}">You have signed out.</div>
    <form th:action="@{/login}" method="post">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">Sign in</button>
    </form>
</main>
</body>
</html>
